[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtg-builder"
version = "0.1.0"
description = "Base de dados e ferramentas de deck building para Magic: The Gathering"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
knowledge = ["pypdf>=4"]

[project.scripts]
mtg = "mtg_builder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
